  <style>
    .blog-container { max-width: 800px; margin: 3rem auto; padding: 0 1.5rem; }
    .post.entrada {
      background: white;
      padding: 2rem;
      margin-bottom: 2rem;
      border-radius: var(--borde-redondo);
      box-shadow: var(--sombra-suave);
      transition: transform 0.3s, box-shadow 0.3s, opacity 0.6s, transform 0.6s;
      /* Para la animación inicial estarán ocultas y las revela el observer */
      opacity: 0;
      transform: translateY(30px);
    }
    .post.entrada.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .post.entrada:hover {
      transform: translateY(-5px);
      box-shadow: var(--sombra-media);
    }
    .post h2 { color: var(--color-primario); }
    .post .fecha { color: var(--color-acento); font-size: 0.9rem; margin-bottom: 0.8rem; }
  </style>

  <script>
    // Configuración: cambia estos valores por los tuyos
    const repoOwner = 'astechtechnologie';
const repoName = 'yullyrodriguezpsicologa';
    const apiUrl = https://api.github.com/repos/${repoOwner}/${repoName}/contents/posts;

    const container = document.getElementById('posts-container');

    async function cargarEntradas() {
      try {
        const respuesta = await fetch(apiUrl);
        const archivos = await respuesta.json();

        if (!Array.isArray(archivos)) {
          container.innerHTML = '<p>No hay artículos todavía. ¡Vuelve pronto!</p>';
          return;
        }

        container.innerHTML = ''; // Limpia el mensaje "Cargando..."

        for (const archivo of archivos) {
          if (archivo.name.endsWith('.md')) {
            // Obtiene el contenido del archivo Markdown
            const mdResp = await fetch(archivo.download_url);
            const mdTexto = await mdResp.text();

            // Convierte Markdown a HTML
            const htmlContenido = marked.parse(mdTexto);

            // Extrae título y fecha del "frontmatter" (formato --- clave: valor ---)
            const tituloMatch = mdTexto.match(/title:\s*(.+)/);
            const fechaMatch = mdTexto.match(/date:\s*(.+)/);
            const titulo = tituloMatch ? tituloMatch[1] : archivo.name.replace('.md', '');
            const fecha = fechaMatch ? fechaMatch[1] : '';

            // Crea el elemento de la entrada
            const postDiv = document.createElement('div');
            postDiv.className = 'post entrada';  // Combina las clases para estilo y animación
            postDiv.innerHTML = `
              <h2>${titulo}</h2>
              ${fecha ? <p class="fecha">${fecha}</p> : ''}
              <div>${htmlContenido}</div>
            `;

            container.appendChild(postDiv);
          }
        }

        if (container.innerHTML === '') {
          container.innerHTML = '<p>No hay artículos todavía. ¡Vuelve pronto!</p>';
        } else {
          // Activar animaciones de entrada para los nuevos elementos
          const observador = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                entry.target.classList.add('visible');
              }
            });
          }, { threshold: 0.2 });

          document.querySelectorAll('.post.entrada').forEach(el => observador.observe(el));
        }
      } catch (error) {
        container.innerHTML = '<p>Error al cargar el blog. Por favor, inténtalo más tarde.</p>';
        console.error(error);
      }
    }

    cargarEntradas();
  </script>
